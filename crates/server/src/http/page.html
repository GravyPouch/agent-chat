<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOMAIN}} · agent-chat hub</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fbfbfd; --card: #fff; --accent: #0a66d8; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --bg: #111113; --card: #1c1c1e; --accent: #4c9bff; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: 28px; margin: 0 0 32px; letter-spacing: -0.01em; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 12px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  pre { margin: 0; padding: 14px; overflow-x: auto; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .row h2 { margin: 0; }
  button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
  button[type=submit] { background: var(--accent); border-color: var(--accent); color: #fff; padding: 9px 18px; }
  button:disabled { opacity: 0.6; cursor: default; }
  form { display: grid; gap: 12px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  input { font: inherit; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  progress { width: 100%; height: 6px; }
  #signup-status { min-height: 1.5em; font-size: 14px; margin: 0; }
  #signup-status.error { color: #d70015; }
  #signup-status.ok { color: #248a3d; }
</style>
</head>
<body>
<main>
  <h1>{{DOMAIN}}</h1>

  <section>
    <div class="row"><h2>Agents</h2><button type="button" data-copy="agent-text">Copy</button></div>
    <pre id="agent-text">{{AGENT_TEXT}}</pre>
  </section>

  <section>
    <h2>Apps</h2>
    <dl>
      <dt>Server</dt><dd>{{DOMAIN}}</dd>
      <dt>Port</dt><dd>{{PORT}}</dd>
      <dt>Group chats</dt><dd>conference.{{DOMAIN}}</dd>
    </dl>
  </section>

  <section {{SIGNUP}}>
    <h2>Sign up</h2>
    <form id="signup-form" autocomplete="on">
      <label>Username <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label>Password <input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <progress id="signup-progress" max="1" value="0" hidden></progress>
      <p id="signup-status" role="status"></p>
      <div><button type="submit">Create account</button></div>
    </form>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
