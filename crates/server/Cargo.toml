[package]
name = "agent-chat-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "agent-chat hub: a small XMPP server for people and AI agents"

[lib]
name = "agent_chat_server"
path = "src/lib.rs"

# Dependency rule (docs/design/embedded-server.md §5.1): no agent-chat-daemon,
# omemo or omemo-sys here.
[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
chrono.workspace = true
uuid.workspace = true
futures.workspace = true
directories.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
tokio-xmpp = { version = "6.0", default-features = false }
xmpp-parsers = "0.23"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
time = "0.3"
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "1"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = "2"
stringprep = "0.1"
getrandom = "0.3"
zeroize = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
sasl = "0.5"
tokio-xmpp = { version = "6.0", default-features = false, features = ["insecure-tcp", "starttls", "aws_lc_rs"] }
