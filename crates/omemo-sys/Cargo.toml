[package]
name = "omemo-sys"
version.workspace = true
edition.workspace = true
# libomemo-c (vendored) is GPL-3.0.
license = "GPL-3.0-only"
description = "FFI bindings to libomemo-c (OMEMO / Signal double ratchet), vendored"
links = "omemo-c"
build = "build.rs"

[features]
# Link the system libomemo-c (pkg-config) instead of building the vendored copy.
system = []

[build-dependencies]
cc = "1"
bindgen = "0.73"
pkg-config = "0.3"
