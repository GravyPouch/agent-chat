[package]
name = "agent-chat-gui"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop GUI for agent-chat (GPUI Kit)"

[[bin]]
name = "agent-chat-gui"
path = "src/main.rs"

[dependencies]
agent-chat-proto.workspace = true
boopface = { path = "../boopface" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
gpui-kit = "0.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
# The Dock badge. The same versions and features GPUI already uses.
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString"] }
