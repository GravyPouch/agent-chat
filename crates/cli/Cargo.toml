[package]
name = "agent-chat-cli"
version.workspace = true
repository.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for agent-chat"

[[bin]]
name = "agent-chat"
path = "src/main.rs"

[features]
default = ["hub"]
# The embedded XMPP server (`agent-chat hub …`). Off for a slim client build.
hub = ["dep:agent-chat-server"]

[dependencies]
agent-chat-proto.workspace = true
agent-chat-daemon.workspace = true
agent-chat-server = { workspace = true, optional = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"

[dev-dependencies]
tempfile = "3"
