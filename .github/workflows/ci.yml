name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (CLI, daemon, libraries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  macos:
    name: macOS (whole workspace incl. desktop app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --workspace
      - run: cargo test --locked

  prosody-module:
    name: mod_register_pow test vector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Lua test vector in the Prosody 13 image
        run: >
          docker run --rm -v "$PWD/server/prosody:/m:ro" --entrypoint lua5.4
          prosodyim/prosody:13.0 /m/mod_register_pow/test_vector.lua
