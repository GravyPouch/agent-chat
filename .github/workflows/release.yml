# DRAFT release pipeline. Inert until a tag matching v* is pushed: it has no branch,
# pull-request or schedule trigger.
#
# On `git push origin vX.Y.Z` it:
#   1. checks that the tag matches the workspace version and that CHANGELOG.md has a
#      "## [X.Y.Z]" section (the release notes);
#   2. builds agent-chat.app (GUI + bundled CLI) for Apple Silicon, signs it with the
#      Developer ID certificate, notarizes and staples it, and makes a .zip and a .dmg;
#   3. builds Linux CLI tarballs (x86_64, aarch64);
#   4. publishes a GitHub Release with every artifact and a SHA256SUMS file;
#   5. for non-prerelease tags, opens a pull request on GravyPouch/homebrew-tap that
#      bumps Formula/agent-chat.rb and Casks/agent-chat.rb. The tap's own brew test-bot
#      workflow then builds bottles; merge it with `brew pr-pull`.
#
# Secrets (documented in docs/design/homebrew.md, section 8). Store the signing and
# notarization ones in the `release` environment, with required reviewers:
#   MACOS_CERTIFICATE_P12_BASE64  Developer ID Application certificate + key (.p12), base64
#   MACOS_CERTIFICATE_PASSWORD    password of that .p12
#   MACOS_SIGNING_IDENTITY        "Developer ID Application: NAME (TEAMID)"
#   APPLE_API_KEY_P8_BASE64       App Store Connect API key (.p8), base64
#   APPLE_API_KEY_ID              its key ID
#   APPLE_API_ISSUER_ID           its issuer ID (team keys only)
#   HOMEBREW_TAP_TOKEN            token that can push branches and open PRs on the tap
#
# Pin third-party actions to commit SHAs before the first real release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BUNDLE_ID: io.github.gravypouch.agent-chat
  TAP_REPOSITORY: GravyPouch/homebrew-tap

jobs:
  meta:
    name: Check version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag must match the workspace version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "agent-chat-cli") | .version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the Cargo.toml version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no non-empty '## [$VERSION]' section"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  macos-app:
    name: macOS app (build, sign, notarize)
    needs: meta
    runs-on: macos-26
    environment: release
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-macos-arm64

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # Keep the login keychain in the search list, add ours in front of it.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, bundle, sign and notarize
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$SIGNING_IDENTITY" ] || [ -z "$NOTARY_KEY_ID" ]; then
            echo "::error::signing or notarization secrets are missing; refusing to publish an unsigned app"
            exit 1
          fi
          packaging/macos/bundle.sh --version "$VERSION" --target aarch64-apple-darwin --out dist --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/agent-chat-*.zip
            dist/agent-chat-*.dmg
          if-no-files-found: error

      - name: Delete the temporary keychain and API key
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

  linux-cli:
    name: Linux CLI (${{ matrix.target }})
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p agent-chat-cli --target "$TARGET"

      - name: Package
        run: |
          bin="target/$TARGET/release/agent-chat"
          test "$("$bin" --version)" = "agent-chat $VERSION"
          name="agent-chat-$VERSION-$TARGET"
          mkdir -p "stage/$name" dist
          cp "$bin" LICENSE README.md THIRD_PARTY_NOTICES.md "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [meta, macos-app, linux-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the assets and write SHA256SUMS
        run: |
          mkdir dist
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' -o -name '*.tar.gz' \) \
            -exec cp {} dist/ \;
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create the release
        run: |
          flags=(--title "agent-chat $VERSION" --notes-file artifacts/release-notes/release-notes.md --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  bump-tap:
    name: Open a pull request on the Homebrew tap
    needs: [meta, release]
    if: needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Checksums of the source archive and the app
        run: |
          src_url="https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/v$VERSION.tar.gz"
          app_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/agent-chat-$VERSION-macos-arm64.zip"
          src_sha256="$(curl -fsSL --retry 3 "$src_url" | sha256sum | cut -d' ' -f1)"
          app_sha256="$(curl -fsSL --retry 3 "$app_url" | sha256sum | cut -d' ' -f1)"
          {
            echo "SRC_URL=$src_url"
            echo "SRC_SHA256=$src_sha256"
            echo "APP_SHA256=$app_sha256"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the formula and the cask, one commit each
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "agent-chat-$VERSION"

          # Only the top-level url/sha256 match: bottle lines are indented further.
          sed -i -E \
            -e "s|^  url \"https://github.com/[^\"]+/archive/refs/tags/v[^\"]+\.tar\.gz\"$|  url \"$SRC_URL\"|" \
            -e "s|^  sha256 \"[0-9a-f]{64}\"$|  sha256 \"$SRC_SHA256\"|" \
            Formula/agent-chat.rb
          ruby -c Formula/agent-chat.rb
          if git diff --quiet -- Formula/agent-chat.rb; then
            echo "::error::Formula/agent-chat.rb did not change"
            exit 1
          fi
          git commit -m "agent-chat $VERSION" -- Formula/agent-chat.rb

          sed -i -E \
            -e "s|^  version \"[^\"]+\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \"[0-9a-f]{64}\"$|  sha256 \"$APP_SHA256\"|" \
            Casks/agent-chat.rb
          ruby -c Casks/agent-chat.rb
          if git diff --quiet -- Casks/agent-chat.rb; then
            echo "::error::Casks/agent-chat.rb did not change"
            exit 1
          fi
          git commit -m "agent-chat $VERSION (cask)" -- Casks/agent-chat.rb

          git push origin "agent-chat-$VERSION"

      - name: Open the pull request
        working-directory: tap
        run: |
          gh pr create --repo "$TAP_REPOSITORY" --head "agent-chat-$VERSION" \
            --title "agent-chat $VERSION" \
            --body "Bumps the agent-chat formula and cask to [v$VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION). Merge with \`brew pr-pull\` once the bottles are built."
